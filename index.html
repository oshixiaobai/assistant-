<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>诗音解密 V1.0 · 智能助教</title>
<style>
:root{
  --paper:#F5F1E8;        /* 宣纸米白 */
  --ink:#1F4E4A;          /* 墨青 */
  --ink-soft:#4E7C77;
  --ink-fade:#9FB6B3;
  --cinnabar:#B03A2E;     /* 朱砂 */
  --rattan:#D4A017;       /* 藤黄 */
  --line:#DCD3BE;
  --kai:"KaiTi","STKaiti","楷体","Songti SC",serif;
  --hei:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:#E7E1D2;
  font-family:var(--hei);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}

/* ============ 设备屏 ============ */
.app{
  position:relative;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.85), transparent 55%),
    radial-gradient(circle at 82% 78%, rgba(180,160,120,.18), transparent 58%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.09'/></svg>");
  overflow:hidden;
}
@media (min-width:900px){
  .app{
    width:820px;height:520px;
    border:10px solid #33322f;border-radius:26px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
  }
}

/* ============ 顶部状态栏 ============ */
.header{
  flex:0 0 auto;
  height:clamp(30px,9vh,46px);
  padding:0 clamp(12px,3vw,22px);
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);
  font-size:clamp(11px,2.6vh,15px);
  letter-spacing:1px;
}
.brand{font-family:var(--kai);font-size:clamp(14px,3.4vh,20px);font-weight:bold;letter-spacing:2px;}
.brand em{font-style:normal;font-size:.7em;opacity:.6;margin-left:4px;font-family:var(--hei);letter-spacing:0;}
.status{display:flex;align-items:center;gap:6px;color:var(--ink-soft);}
.dot{
  width:8px;height:8px;border-radius:50%;background:#2E9E6B;
  box-shadow:0 0 6px #2E9E6B,0 0 12px rgba(46,158,107,.6);
  animation:breathe 2s ease-in-out infinite;
}
.dot.bad{background:var(--cinnabar);box-shadow:0 0 6px var(--cinnabar),0 0 14px rgba(176,58,46,.7);animation:none;}
@keyframes breathe{0%,100%{opacity:1;}50%{opacity:.45;}}

/* ============ 诗词区 ============ */
.poem{
  flex:0 0 auto;
  padding:clamp(6px,2vh,16px) 16px clamp(2px,1vh,8px);
  text-align:center;
}
.poem .src{font-family:var(--kai);font-size:clamp(10px,2.2vh,13px);color:var(--ink-fade);letter-spacing:2px;}
.poem .line{
  font-family:var(--kai);
  font-size:clamp(18px,5.6vh,30px);
  letter-spacing:clamp(2px,1vw,6px);
  margin-top:clamp(2px,1vh,6px);
  color:var(--ink);
}
.poem .line u{
  text-decoration:none;
  border-bottom:1px dashed var(--ink-soft);
  padding-bottom:2px;
}

/* ============ 波形区 ============ */
.wave{
  flex:1 1 auto;
  min-height:0;
  margin:0 clamp(10px,3vw,26px);
  position:relative;
}
.wave canvas{width:100%;height:100%;display:block;}
.wave .axis{
  position:absolute;left:0;right:0;top:50%;height:1px;
  background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px);
  opacity:.7;
}
.wave.hide{opacity:0;transition:opacity .25s;}

/* ============ 麦克风区 ============ */
.mic-zone{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(2px,1vh,10px) 0;
}
.mic-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.mic{
  width:clamp(52px,15vh,86px);height:clamp(52px,15vh,86px);
  position:relative;z-index:2;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer;
}
.mic svg{width:100%;height:100%;display:block;}
.mic path,.mic line{stroke:var(--ink);}
.mic .halo{
  position:absolute;left:50%;top:50%;
  width:150%;height:150%;margin:-75% 0 0 -75%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(31,78,74,.22),transparent 68%);
  z-index:1;
  animation:halo 3.2s ease-in-out infinite;
}
@keyframes halo{0%,100%{transform:scale(.82);opacity:.35;}50%{transform:scale(1.12);opacity:.85;}}

.app[data-state="rec"] .mic{transform:scale(1.12);}
.app[data-state="rec"] .mic path,.app[data-state="rec"] .mic line{stroke:#17544F;}
.app[data-state="rec"] .halo{animation:haloFast 1s ease-in-out infinite;}
@keyframes haloFast{0%,100%{transform:scale(1);opacity:.5;}50%{transform:scale(1.35);opacity:1;}}

.app[data-state="proc"] .mic{transform:scale(.72);opacity:.35;}
.app[data-state="err"] .mic{transform:scale(.72);opacity:.18;}

.hint{
  margin-top:clamp(2px,1.2vh,10px);
  font-family:var(--kai);
  font-size:clamp(12px,3vh,17px);
  letter-spacing:2px;color:var(--ink-soft);
  min-height:1.4em;transition:color .3s;
}
.timer{
  font-family:var(--hei);
  font-size:clamp(10px,2.4vh,14px);
  color:var(--ink-fade);letter-spacing:1px;
  margin-top:2px;min-height:1.2em;
  font-variant-numeric:tabular-nums;
}
.timer.on{color:var(--cinnabar);}

/* ============ 底部控制 ============ */
.footer{
  flex:0 0 auto;
  padding:clamp(4px,1.6vh,16px) 16px clamp(10px,3vh,20px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.4vh,10px);
}
.progress{
  width:min(70%,320px);height:2px;background:var(--line);border-radius:2px;overflow:hidden;
  opacity:0;transition:opacity .3s;
}
.progress.on{opacity:1;}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .12s linear;}
.wood{
  font-family:var(--kai);
  font-size:clamp(14px,3.6vh,20px);
  letter-spacing:4px;
  color:#F7F1E3;
  padding:clamp(7px,2vh,12px) clamp(26px,9vw,52px);
  border:1px solid #4a2a16;border-radius:6px;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,rgba(0,0,0,.06) 2px 6px),
    linear-gradient(180deg,#8a5a34,#5e3620);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 3px 0 #4a2a16,0 6px 14px rgba(0,0,0,.22);
  cursor:pointer;transition:transform .08s,box-shadow .08s,filter .3s;
}
.wood:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 #4a2a16;}
.wood.rec{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,rgba(0,0,0,.06) 2px 6px),linear-gradient(180deg,#8E3A2E,#6A2318);border-color:#4a1a12;}
.wood:disabled{filter:grayscale(.7) brightness(.85);cursor:default;}

/* ============ 太极加载环 ============ */
.loader{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(.6);
  width:clamp(58px,16vh,92px);height:clamp(58px,16vh,92px);
  opacity:0;pointer-events:none;z-index:5;
  transition:opacity .25s,transform .35s cubic-bezier(.34,1.56,.64,1);
}
.loader.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
.loader .ring{position:absolute;inset:0;animation:spin 2.4s linear infinite;}
.loader .taiji{position:absolute;inset:14%;animation:spin 1.6s cubic-bezier(.6,.05,.4,.95) infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader.broken{animation:shatterOut .5s forwards;}
@keyframes shatterOut{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  35%{transform:translate(-50%,-50%) scale(1.3) rotate(12deg);opacity:.9;}
  100%{transform:translate(-50%,-50%) scale(.2) rotate(40deg);opacity:0;}
}
.frag{position:absolute;left:50%;top:50%;width:8px;height:3px;background:var(--ink);border-radius:2px;opacity:0;}
.frag.go{animation:fly .6s ease-out forwards;}
@keyframes fly{
  0%{opacity:.9;transform:translate(-50%,-50%) rotate(0) translate(0,0);}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) translate(var(--tx),var(--ty));}
}

/* ============ 边缘红光 ============ */
.edge{
  position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;
  box-shadow:inset 0 0 clamp(30px,9vw,70px) rgba(176,58,46,.85);
}
.edge.on{animation:edgeFlash 1.1s ease-out 2;}
@keyframes edgeFlash{0%{opacity:0;}18%{opacity:1;}45%{opacity:.25;}70%{opacity:.9;}100%{opacity:0;}}

/* ============ 回答卡片（第四幕） ============ */
.mask{
  position:absolute;inset:0;z-index:20;
  background:rgba(31,38,36,.42);
  display:flex;align-items:center;justify-content:center;
  padding:12px;
  opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
}
.mask.on{opacity:1;visibility:visible;}
.card{
  width:min(94%,560px);
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:10px;
  padding:clamp(10px,3vh,22px) clamp(14px,4vw,28px);
  text-align:center;
  box-shadow:0 16px 46px rgba(0,0,0,.4);
  transform:scale(.86) translateY(14px);opacity:0;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s,border-color .45s,box-shadow .45s;
  cursor:pointer;
}
.mask.on .card{transform:scale(1) translateY(0);opacity:1;}
/* 揭示阶段：整卡翻红 */
.card.bad{border-color:var(--cinnabar);box-shadow:0 16px 46px rgba(176,58,46,.4);}
.card .tag{
  display:inline-block;font-family:var(--kai);font-weight:bold;
  color:#fff;background:var(--ink);
  font-size:clamp(12px,2.8vh,16px);letter-spacing:2px;
  padding:2px 12px;border-radius:3px;
  transition:background .45s;
}
.card.bad .tag{background:var(--cinnabar);}
/* 它听到的问题 */
.card .ask{
  font-family:var(--kai);font-size:clamp(13px,3.3vh,20px);
  color:var(--ink);letter-spacing:1px;
  margin:clamp(5px,1.4vh,11px) 0 0;
}
.card .ask span{
  text-decoration:underline;text-decoration-style:solid;text-decoration-color:transparent;
  text-underline-offset:5px;transition:color .4s,text-decoration-color .4s;
}
/* 「无赖」二字：字形认错了 —— 红波浪线只打在字上 */
.card .ask span.bad{
  color:var(--cinnabar);font-weight:bold;
  text-decoration-color:var(--cinnabar);text-decoration-style:wavy;
}
/* 十字总评：意思没错，翻红时保持墨青，不参与判错 */
.card .sum{
  font-family:var(--kai);font-weight:bold;
  font-size:clamp(16px,4.6vh,27px);
  color:var(--ink);letter-spacing:clamp(2px,1vw,6px);
  margin:clamp(6px,1.6vh,13px) 0 0;
}
/* 简短释义 */
.card .exp{
  font-size:clamp(10px,2.2vh,13px);color:var(--ink-soft);
  margin-top:4px;line-height:1.6;letter-spacing:.5px;
}
/* 真相：延迟揭示 */
.card .truth{
  opacity:0;transform:translateY(6px);
  transition:opacity .45s,transform .45s;
  margin-top:clamp(6px,1.6vh,12px);
  padding-top:clamp(5px,1.2vh,9px);
  border-top:1px dashed var(--line);
}
.card .truth.show{opacity:1;transform:translateY(0);}
.card .truth .tp{
  font-family:var(--kai);font-weight:bold;
  font-size:clamp(14px,3.2vh,19px);color:var(--cinnabar);
  letter-spacing:3px;margin-bottom:clamp(3px,.8vh,6px);
}
.card .truth .tl{
  font-family:var(--kai);font-size:clamp(11px,2.6vh,15px);
  color:var(--cinnabar);letter-spacing:1px;line-height:1.65;
}
.card .truth .tl b{font-weight:bold;font-size:1.14em;letter-spacing:2px;}
/* 意思没错的那一行：墨青，与朱砂形成对错对照 */
.card .truth .tk{
  font-family:var(--kai);font-size:clamp(11px,2.6vh,15px);
  color:var(--ink);letter-spacing:1px;line-height:1.65;
  margin-top:2px;
}
.card .truth .tk b{font-weight:bold;font-size:1.14em;letter-spacing:2px;}
.card .acts{display:flex;gap:10px;justify-content:center;margin-top:clamp(6px,1.8vh,14px);flex-wrap:wrap;}
.mini{
  font-family:var(--kai);font-size:clamp(11px,2.6vh,15px);letter-spacing:2px;
  padding:6px 16px;border-radius:5px;cursor:pointer;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
}
.mini:hover{background:rgba(31,78,74,.08);}
.mini.ghost{border-color:var(--line);color:var(--ink-soft);text-decoration:none;display:inline-block;}

/* ============ 隐藏热区（右下角三连点） ============ */
.hot{
  position:absolute;right:0;bottom:0;width:78px;height:78px;z-index:15;
  background:transparent;
}
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">

  <!-- 顶部状态栏 -->
  <div class="header">
    <div class="brand">诗音解密<em>V1.0</em></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">系统在线</span></div>
  </div>

  <!-- 诗词展示区 -->
  <div class="poem">
    <div class="src">清平乐·村居 · 辛弃疾</div>
    <div class="line">“最喜小儿<u>亡</u>赖，溪头卧剥莲蓬。”是什么意思？</div>
  </div>

  <!-- 动态波形区 -->
  <div class="wave" id="waveBox">
    <div class="axis"></div>
    <canvas id="wave"></canvas>
  </div>

  <!-- 核心交互区 -->
  <div class="mic-zone">
    <div class="mic-wrap">
      <div class="halo"></div>
      <div class="mic" id="mic">
        <svg viewBox="0 0 64 64" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 7c-7.2 0-12.5 5.3-12.5 12.5v11.8c0 7.2 5.3 12.5 12.5 12.5s12.5-5.3 12.5-12.5V19.5C44.5 12.3 39.2 7 32 7z" fill="rgba(31,78,74,.07)"/>
          <path d="M17.5 33.5c0 10.2 6.5 16.7 14.5 16.7s14.5-6.5 14.5-16.7"/>
          <line x1="32" y1="50.2" x2="32" y2="58"/>
          <line x1="22" y1="58" x2="42" y2="58"/>
        </svg>
      </div>
    </div>
    <div class="hint" id="hint">提问系统就绪 · 请对着它发问</div>
    <div class="timer" id="timer"></div>
  </div>

  <!-- 太极加载环 -->
  <div class="loader" id="loader">
    <svg class="ring" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="none" stroke="#1F4E4A" stroke-opacity=".22" stroke-width="2"/>
      <circle cx="50" cy="50" r="44" fill="none" stroke="#1F4E4A" stroke-width="3.4"
              stroke-linecap="round" stroke-dasharray="52 224" transform="rotate(-90 50 50)"/>
      <circle cx="50" cy="50" r="36" fill="none" stroke="#B03A2E" stroke-opacity=".35" stroke-width="1.6"
              stroke-linecap="round" stroke-dasharray="20 206" transform="rotate(120 50 50)"/>
    </svg>
    <svg class="taiji" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="#F5F1E8" stroke="#1F4E4A" stroke-width="2"/>
      <path d="M50 4a46 46 0 0 1 0 92 23 23 0 0 1 0-46 23 23 0 0 0 0-46z" fill="#1F4E4A"/>
      <circle cx="50" cy="27" r="7" fill="#F5F1E8"/>
      <circle cx="50" cy="73" r="7" fill="#1F4E4A"/>
    </svg>
  </div>

  <!-- 底部控制区 -->
  <div class="footer">
    <div class="progress" id="progBox"><i id="prog"></i></div>
    <button class="wood" id="mainBtn">开 始 提 问</button>
  </div>

  <!-- 边缘红光 -->
  <div class="edge" id="edge"></div>

  <!-- 第四幕：助教回答卡片 -->
  <div class="mask" id="mask">
    <div class="card" id="card">
      <div class="tag">【助教回答】</div>
      <div class="ask">你问的是：「最喜小儿<span id="badWord">无赖</span>」什么意思？</div>
      <div class="sum">小儿最可爱，天真又调皮</div>
      <div class="exp">最惹人喜爱的是小儿子，他天真调皮，正趴在溪边剥莲蓬吃。</div>
      <div class="truth" id="truth">
        <div class="tp">字 可 以 错 · 意 思 别 错</div>
        <div class="tl">它把「<b>亡赖</b>」认成了「<b>无赖</b>」—— 字，确实错了。</div>
        <div class="tk">可意思没跟着错：<b>顽皮淘气</b>、天真可爱，正是词人的本意。</div>
      </div>
      <div class="acts">
        <button class="mini" id="btnRetry">再问一次</button>
      </div>
    </div>
  </div>

  <!-- 隐藏热区：右下角连续点击 3 下 → 直达报错 -->
  <div class="hot" id="hot"></div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     常量
     ========================================================= */
  var MAX_SEC = 15;      // 保险二：录音 15 秒自动结束
  var FAKE_MS = 1500;    // 第三幕：伪装识别 1.5 秒

  var app   = document.getElementById('app');
  var mic   = document.getElementById('mic');
  var hint  = document.getElementById('hint');
  var timer = document.getElementById('timer');
  var btn   = document.getElementById('mainBtn');
  var waveBox = document.getElementById('waveBox');
  var cv    = document.getElementById('wave');
  var c2    = cv.getContext('2d');
  var loader= document.getElementById('loader');
  var edge  = document.getElementById('edge');
  var mask  = document.getElementById('mask');
  var card  = document.getElementById('card');
  var badWord = document.getElementById('badWord');
  var truth = document.getElementById('truth');
  var revealed = false, revealTimer = null;
  var progBox = document.getElementById('progBox');
  var prog  = document.getElementById('prog');
  var dot   = document.getElementById('dot');
  var statusTxt = document.getElementById('statusTxt');

  var state = 'idle';          // idle | rec | proc | err
  var raf = null;
  var recStart = 0, tickTimer = null, endTimer = null;
  var level = 0;               // 平滑后的音量
  var simEnv = 0.55, simPhase = 0;

  /* =========================================================
     音频引擎（音效合成，全程离线，不依赖网络）
     ========================================================= */
  var AC = null;
  function ac(){
    if(!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      AC = new C();
    }
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }
  function noiseBuf(ctx, sec){
    var len = Math.floor(ctx.sampleRate * sec);
    var b = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = b.getChannelData(0);
    for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
    return b;
  }
  // 古琴拨弦
  function pluck(freq, at, dur, vol){
    var ctx = ac(); if(!ctx) return;
    var t = ctx.currentTime + at;
    [1, 2.02, 3.01].forEach(function(mul, i){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq*mul, t);
      o.frequency.exponentialRampToValueAtTime(freq*mul*0.985, t+dur);
      var v = vol / (i*2.6 + 1);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(v, t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+dur+0.05);
    });
  }
  // 第三幕：古琴扫弦 + 键盘敲击
  function sfxThinking(){
    var ctx = ac(); if(!ctx) return;
    var scale = [196, 220, 262, 294, 330, 392, 440];
    for(var i=0;i<7;i++) pluck(scale[i], i*0.055, 0.9, 0.085);
    // 键盘敲击（极短噪声脉冲）
    for(var k=0;k<9;k++){
      (function(delay){
        var src = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        src.buffer = noiseBuf(ctx, 0.05);
        f.type = 'bandpass'; f.frequency.value = 1800 + Math.random()*1600; f.Q.value = 1.2;
        var t = ctx.currentTime + delay;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.16, t+0.003);
        g.gain.exponentialRampToValueAtTime(0.0008, t+0.045);
        src.connect(f); f.connect(g); g.connect(ctx.destination);
        src.start(t); src.stop(t+0.06);
      })(0.18 + k*0.075 + Math.random()*0.03);
    }
  }
  // 作答完成：清磬一声（机器答得又快又自信）
  function sfxQing(){
    var ctx = ac(); if(!ctx) return;
    var t = ctx.currentTime;
    [880, 1320, 1760].forEach(function(f, i){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      var v = 0.15 / (i + 1);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(v, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 1.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 1.3);
    });
  }
  // 第四幕：破锣 / 报错音
  function sfxError(){
    var ctx = ac(); if(!ctx) return;
    var t = ctx.currentTime;
    // 锣体：低频三角波 + 下滑
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(275, t);
    o.frequency.exponentialRampToValueAtTime(96, t+1.5);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.30, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, t+1.6);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+1.7);
    // 金属噪声层
    var src = ctx.createBufferSource(), ng = ctx.createGain(), f = ctx.createBiquadFilter();
    src.buffer = noiseBuf(ctx, 1.6);
    f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.7;
    ng.gain.setValueAtTime(0.20, t);
    ng.gain.exponentialRampToValueAtTime(0.0008, t+1.4);
    src.connect(f); f.connect(ng); ng.connect(ctx.destination);
    src.start(t); src.stop(t+1.6);
  }
  function buzz(ms){
    if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} }
  }

  /* =========================================================
     波形绘制（真实麦克风优先，失败则无缝降级为模拟波形）
     ========================================================= */
  var audioCtx = null, analyser = null, timeData = null, micStream = null;

  function resizeCanvas(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth, h = cv.clientHeight;
    if(w === 0 || h === 0) return;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    c2.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', function(){ resizeCanvas(); if(!raf) drawStatic(); });

  function attachMic(){
    // 异步尝试真实麦克风；成功则接管数据源，失败则保持模拟。全过程不阻塞 UI。
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try{
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
        micStream = stream;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.75;
        timeData = new Uint8Array(analyser.fftSize);
        audioCtx.createMediaStreamSource(stream).connect(analyser);
      }).catch(function(){ /* 静默降级，模拟波形继续 */ });
    }catch(e){ /* 非安全上下文：静默降级 */ }
  }
  function stopMic(){
    try{ if(micStream) micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    try{ if(audioCtx && audioCtx.close) audioCtx.close(); }catch(e){}
    micStream = null; analyser = null; audioCtx = null;
  }

  function realPoints(n){
    analyser.getByteTimeDomainData(timeData);
    var step = Math.floor(timeData.length / n);
    var out = new Array(n), sum = 0;
    for(var i=0;i<n;i++){
      var m = 0;
      for(var j=0;j<step;j++){
        var v = (timeData[i*step+j] - 128) / 128;
        sum += v*v;
        if(Math.abs(v) > Math.abs(m)) m = v;
      }
      out[i] = m;
    }
    var rms = Math.sqrt(sum / (n*step));
    var lv = Math.min(1, rms * 5.2);
    level = level*0.75 + lv*0.25;
    return out;
  }
  function simPoints(n){
    simPhase += 0.075;
    var lo = (state === 'rec') ? 0.34 : 0.10;   // 待机只留微弱呼吸
    var hi = (state === 'rec') ? 1.00 : 0.26;
    simEnv += (Math.random()-0.5)*0.16;
    if(simEnv < lo) simEnv = lo;
    if(simEnv > hi) simEnv = hi;
    level = level*0.7 + simEnv*0.3;
    var out = new Array(n);
    for(var i=0;i<n;i++){
      var u = i/(n-1);
      var v = Math.sin(u*Math.PI*5.5 + simPhase)*0.62
            + Math.sin(u*Math.PI*11.5 - simPhase*0.8)*0.26
            + (Math.random()-0.5)*0.14;
      out[i] = v * (0.55 + 0.45*Math.sin(Math.PI*u));
    }
    return out;
  }

  function draw(){
    raf = requestAnimationFrame(draw);
    var w = cv.clientWidth, h = cv.clientHeight;
    if(!w || !h) return;
    c2.clearRect(0,0,w,h);

    var N = 72;
    var pts = (analyser && state === 'rec') ? realPoints(N) : simPoints(N);
    var amp = (0.06 + Math.min(1, level) * 0.92) * (h/2) * 0.86;

    var px = new Array(N), py = new Array(N);
    for(var i=0;i<N;i++){
      px[i] = (i/(N-1)) * w;
      py[i] = h/2 - pts[i] * amp;
    }

    // 墨青渐变波形
    var grad = c2.createLinearGradient(0,0,w,0);
    grad.addColorStop(0,   'rgba(31,78,74,0.10)');
    grad.addColorStop(0.5, 'rgba(31,78,74,0.95)');
    grad.addColorStop(1,   'rgba(31,78,74,0.10)');

    c2.beginPath();
    c2.moveTo(px[0], py[0]);
    for(var k=1;k<N;k++){
      var cx = (px[k-1]+px[k])/2, cy = (py[k-1]+py[k])/2;
      c2.quadraticCurveTo(px[k-1], py[k-1], cx, cy);
    }
    c2.lineTo(px[N-1], py[N-1]);
    c2.strokeStyle = grad;
    c2.lineWidth = Math.max(1.6, h*0.035);
    c2.lineCap = 'round';
    c2.shadowColor = 'rgba(31,78,74,.35)';
    c2.shadowBlur = 8;
    c2.stroke();
    c2.shadowBlur = 0;

    // 半透明镜像（增加"声波"体量感）
    c2.globalAlpha = 0.16;
    c2.lineWidth = 1;
    c2.beginPath();
    for(var m=0;m<N;m++){
      var yy = h/2 + (h/2 - py[m]) * 0.42;
      if(m === 0) c2.moveTo(px[m], yy); else c2.lineTo(px[m], yy);
    }
    c2.strokeStyle = '#1F4E4A';
    c2.stroke();
    c2.globalAlpha = 1;
  }
  function startDraw(){ if(!raf){ resizeCanvas(); raf = requestAnimationFrame(draw); } }
  function stopDraw(){ if(raf){ cancelAnimationFrame(raf); raf = null; } c2.clearRect(0,0,cv.width,cv.height); }
  /* 待机：画布清空，只留 CSS 的虚线中轴作静止基线，波形完全不动；
     只有点了「开始录音」才启动 rAF 动画 */
  function drawStatic(){
    resizeCanvas();
    c2.clearRect(0,0,cv.width,cv.height);
  }

  /* =========================================================
     状态机：四幕剧
     ========================================================= */
  function setState(s){ state = s; app.setAttribute('data-state', s); }

  function fmt(s){
    s = Math.max(0, Math.floor(s));
    return (s<10?'0':'') + s;
  }

  // 第一幕 → 第二幕：开始录音
  function startRec(){
    if(state === 'rec' || state === 'proc') return;
    ac();                       // 用户手势内初始化音频
    resetErrorUI();
    setState('rec');
    hint.textContent = '正在聆听…';
    hint.style.color = '';
    timer.textContent = '00:00';
    timer.classList.add('on');
    btn.textContent = '结 束 提 问';
    btn.classList.add('rec');
    btn.disabled = false;
    progBox.classList.add('on');
    prog.style.width = '0%';
    waveBox.classList.remove('hide');
    startDraw();
    buzz(35);                   // 轻微触觉反馈
    recStart = Date.now();

    tickTimer = setInterval(function(){
      var el = (Date.now() - recStart)/1000;
      timer.textContent = '00:' + fmt(el);
      prog.style.width = Math.min(100, el/MAX_SEC*100) + '%';
    }, 100);

    // 保险二：15 秒强制结束
    endTimer = setTimeout(function(){ finishRec(true); }, MAX_SEC*1000);

    // 真实麦克风异步接入（权限弹窗不阻塞流程）
    attachMic();
  }

  // 第二幕 → 第三幕：结束录音，进入伪装识别
  function finishRec(auto){
    if(state !== 'rec') return;
    clearInterval(tickTimer); clearTimeout(endTimer);
    timer.classList.remove('on');
    stopMic();
    waveBox.classList.add('hide');
    stopDraw();
    btn.disabled = true;
    btn.textContent = '识 别 中…';
    setState('proc');
    hint.textContent = '录音完成，正在解析…';

    loader.classList.remove('broken');
    loader.classList.add('on');
    sfxThinking();

    setTimeout(function(){ hint.textContent = '正在提取声学特征…'; }, 120);
    setTimeout(function(){ hint.textContent = '正在匹配语言模型…'; }, 780);

    // 1.5 秒后进入第四幕
    setTimeout(function(){ showError(); }, FAKE_MS);
    if(auto) { /* 自动结束时无需额外提示，流程继续 */ }
  }

  // 第三幕 → 第四幕：助教自信作答（卡片先以「完全正常」的面目出现）
  function showError(quick){
    setState('err');
    // 环碎裂
    loader.classList.add('broken');
    var fragHtml = '';
    for(var i=0;i<8;i++) fragHtml += '<div class="frag"></div>';
    loader.insertAdjacentHTML('beforeend', fragHtml);
    var frags = loader.querySelectorAll('.frag');
    for(var k=0;k<frags.length;k++){
      var ang = (Math.PI*2/8)*k + 0.4;
      var dist = 46 + Math.random()*30;
      frags[k].style.setProperty('--rot', (ang*57.3) + 'deg');
      frags[k].style.setProperty('--tx', (Math.cos(ang)*dist).toFixed(1) + 'px');
      frags[k].style.setProperty('--ty', (Math.sin(ang)*dist).toFixed(1) + 'px');
      frags[k].classList.add('go');
    }
    setTimeout(function(){
      var old = loader.querySelectorAll('.frag');
      for(var i=0;i<old.length;i++) old[i].remove();
      loader.classList.remove('on','broken');
    }, 700);

    hint.textContent = '回答已生成';
    hint.style.color = '';
    btn.disabled = false;
    btn.classList.remove('rec');
    btn.textContent = '再 问 一 次';
    progBox.classList.remove('on');
    prog.style.width = '0%';

    // 卡片以「正常」面目出现：清磬一声，机器答得又快又自信
    revealed = false;
    card.classList.remove('bad');
    badWord.classList.remove('bad');
    truth.classList.remove('show');
    sfxQing();
    buzz(40);
    setTimeout(function(){ mask.classList.add('on'); }, 220);

    // 留出老师讲一句话的时间，再当众翻红
    clearTimeout(revealTimer);
    revealTimer = setTimeout(revealNow, quick ? 500 : 1900);
  }

  // 第四幕后半：字形通假无碍，真正翻车的是义项 —— 现代义覆盖了古义
  function revealNow(){
    if(revealed || state !== 'err') return;
    revealed = true;
    card.classList.add('bad');
    badWord.classList.add('bad');
    truth.classList.add('show');
    hint.textContent = '字形认错了 · 意思没跟着错';
    hint.style.color = '#B03A2E';
    edge.classList.remove('on');
    void edge.offsetWidth;
    edge.classList.add('on');
    sfxError();                 // 破锣：错已经发生，只是机器自己不知道
    buzz([420, 90, 260]);       // 长震 + 停顿 + 再震
  }

  function resetErrorUI(){
    clearTimeout(revealTimer);
    revealed = false;
    card.classList.remove('bad');
    badWord.classList.remove('bad');
    truth.classList.remove('show');
    mask.classList.remove('on');
    edge.classList.remove('on');
    dot.classList.remove('bad');
    statusTxt.textContent = '系统在线';
    hint.style.color = '';
  }

  // 回到第一幕
  function toIdle(){
    clearInterval(tickTimer); clearTimeout(endTimer);
    stopMic(); stopDraw();
    resetErrorUI();
    setState('idle');
    hint.textContent = '提问系统就绪 · 请对着它发问';
    timer.textContent = '';
    timer.classList.remove('on');
    btn.disabled = false;
    btn.classList.remove('rec');
    btn.textContent = '开 始 提 问';
    progBox.classList.remove('on');
    prog.style.width = '0%';
    waveBox.classList.remove('hide');
    drawStatic();
  }

  /* =========================================================
     保险一：右下角连点 3 下 → 直达第四幕
     ========================================================= */
  var taps = [];
  document.getElementById('hot').addEventListener('click', function(e){
    e.stopPropagation();
    var now = Date.now();
    taps.push(now);
    taps = taps.filter(function(t){ return now - t < 900; });
    if(taps.length >= 3){
      taps = [];
      emergency();
    }
  });
  function emergency(){
    if(state === 'err') return;
    clearInterval(tickTimer); clearTimeout(endTimer);
    stopMic(); stopDraw();
    waveBox.classList.add('hide');
    loader.classList.add('on');
    loader.classList.remove('broken');
    setState('proc');
    hint.textContent = '正在匹配语言模型…';
    btn.disabled = true;
    btn.textContent = '识 别 中…';
    progBox.classList.remove('on');
    buzz(18);                               // 只有老师能察觉的极短确认震
    setTimeout(function(){ showError(true); }, 420);
  }

  /* =========================================================
     事件绑定
     ========================================================= */
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(state === 'idle') startRec();
    else if(state === 'rec') finishRec(false);
    else if(state === 'err') toIdle();
  });
  mic.addEventListener('click', function(e){
    e.stopPropagation();
    if(state === 'idle') startRec();
  });
  app.addEventListener('click', function(e){
    if(state === 'idle' && e.target.closest('.hot') === null) startRec();
  });
  document.getElementById('btnRetry').addEventListener('click', function(e){ e.stopPropagation(); toIdle(); });
  // 想提前把「无赖」揪出来：点一下卡片即可
  card.addEventListener('click', function(){ revealNow(); });
  mask.addEventListener('click', function(e){ if(e.target === mask) toIdle(); });

  // 桌面调试快捷键：空格 = 开始/结束，Esc = 直达报错
  document.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); if(state==='idle') startRec(); else if(state==='rec') finishRec(false); }
    if(e.code === 'Escape'){ emergency(); }
  });

  // 启动即进入待机：波形静止，等老师点击「开始录音」才动
  window.addEventListener('load', function(){ drawStatic(); });
  setTimeout(function(){ drawStatic(); }, 300);
})();
</script>
</body>
</html>
